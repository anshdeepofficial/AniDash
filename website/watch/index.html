<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1210"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AniDash"><link rel="apple-touch-icon" href="https://anidashweb.vercel.app/assets/anidash_logo.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><title>AniDash Streaming</title></head>
<body><header><img src="https://anidashweb.vercel.app/assets/anidash_logo.png" alt="AniDash"><div><small id="greeting">Welcome</small><strong>AniDash</strong></div><button id="install" hidden>Install</button></header>
<main><section class="search"><input id="search" type="search" placeholder="Search anime…" autocomplete="off"><button id="searchButton">Search</button></section><section><div class="heading"><h1 id="sectionTitle">Trending Anime</h1><span id="status"></span></div><div id="grid" class="grid"></div></section></main>
<nav><button data-view="home" class="active">⌂<span>Home</span></button><button data-view="search">⌕<span>Search</span></button><button data-view="continue">▶<span>Continue</span></button></nav>
<dialog id="details"><button class="close" aria-label="Close">×</button><div id="detailBody"></div></dialog>
<dialog id="player"><div class="playerTop"><button class="playerClose">‹</button><div><small id="playerSource">JUSTANIME</small><strong id="playerTitle">Episode</strong></div></div><video id="video" controls playsinline webkit-playsinline></video><div class="playerOptions"><select id="audio"><option value="sub">Japanese · SUB</option><option value="dub">English · DUB</option></select><span id="playerStatus"></span></div></dialog>
<script src="https://unpkg.com/hls.js@1.6.13/dist/hls.min.js" crossorigin="anonymous"></script><script src="/app.js"></script></body></html>
