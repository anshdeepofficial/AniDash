name: iOS Build Check

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS simulator app
        if: github.event_name == 'pull_request'
        run: flutter build ios --simulator --debug --no-codesign

      - name: Build unsigned iOS test app
        if: github.event_name == 'workflow_dispatch'
        run: flutter build ios --release --no-codesign

      - name: Package unsigned test IPA
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry AniDash-iOS-unsigned.ipa Payload

      - name: Store unsigned test IPA
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AniDash-iOS-unsigned
          path: build/ios/ipa/AniDash-iOS-unsigned.ipa
          if-no-files-found: error
