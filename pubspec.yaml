name: ani_dash

description: >
  🚀 AniDash is a blazing-fast, modern, and user-friendly anime streaming app built with Flutter.
  Stream your favorite anime, keep track of your watch progress, and explore trending shows —
  all in one place. Built with ❤️ by Darkx-dev.

publish_to: "none"

version: 1.8.1+14

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  awesome_snackbar_content: any
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  collection: ^1.19.1
  connectivity_plus: ^6.1.5

  commentum_client:
    git:
      url: https://github.com/commentum/commentum_flutter.git
      ref: main
      path: ./

  dartotsu_extension_bridge:
    path: packages/dartotsu_extension_bridge

  device_info_plus: ^11.2.1
  dynamic_color: 1.7.0
  encrypt: ^5.0.3
  file_picker: ^10.2.0
  flex_color_picker: any
  flex_color_scheme: any

  flutter:
    sdk: flutter

  flutter_highlight: ^0.7.0
  flutter_local_notifications: any
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.0.1

  flutter_secure_storage:
    git:
      url: https://github.com/juliansteenbakker/flutter_secure_storage.git
      ref: master
      path: flutter_secure_storage
  flutter_volume_controller: ^1.3.4
  flutter_web_auth_2: ^4.1.0

  go_router: any
  google_fonts: ^6.2.1
  graphql: ^5.2.3
  highlight: ^0.7.0
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.1.0
  html: ^0.15.5
  http: ^1.4.0
  http_interceptor: ^2.0.0
  iconsax: ^0.0.8
  image: ^4.5.3
  install_plugin: ^2.1.0
  intl: ^0.20.2
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0

  js_packer: ^0.0.5
  logger: ^2.5.0

  media_kit: any
  media_kit_video: any
  media_kit_libs_video: any

  package_info_plus: ^8.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  pseudom: ^1.0.1
  rename: ^3.0.2
  riverpod_annotation: ^3.0.1
  screen_brightness: ^2.1.7
  screenshot: ^3.0.0
  share_plus: ^11.0.0
  shared_preferences: any
  url_launcher: ^6.3.1
  window_manager: ^0.5.0
  workmanager: any
  xpath_selector_html_parser: ^3.0.1
  get: ^4.7.2
  timeago: ^3.7.1

dependency_overrides:
  collection: ^1.19.1
  

dev_dependencies:
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.8.1
  riverpod_generator: ^3.0.0
  isar_community_generator: ^3.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon-modified-2.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon-modified-2.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon-modified-2.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon-modified-2.png"

inno_bundle:
  id: 0516d984-72bf-47d4-bfbc-b2b8fd563479
  publisher: Roshan Kumar
  name: ani_dash
  url: https://github.com/roshancodespace/AniDash
  support_url: https://github.com/roshancodespace/AniDash/issues
  updates_url: https://github.com/roshancodespace/AniDash/releases
  languages:
    - english
  admin: false
